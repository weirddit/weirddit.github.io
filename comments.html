<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    :root {
      --bg: #0b1416;         /* background */
      --text: #d4dbde;       /* comment ka text */
      --strong: #eef1f3;     /* username */
      --weak: #8ba2ad;       /* "3mo ago" aur dot */
      --muted: #b8c5c9;      /* Reply, count, downvote */
      --orange: #ff4500;
      --size: 20px;          /* <-- poore comment ka size yahan se badlo */
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      min-height: 100vh;
      font-family: "Noto Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .comment {
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      column-gap: 0.6em;
      row-gap: 0.9em;
      width: 100%;
      max-width: 34em;
      padding: 1.4em;
      box-sizing: border-box;
      font-size: var(--size);
      color: var(--text);
      background: var(--bg);
    }

    .title {
      flex: 0 0 100%;
      box-sizing: border-box;
      padding-left: calc(0.9em / 1.15);   /* avatar ke beech se shuru (0 = bilkul left, 2.4em = username ke upar se) */
      margin-bottom: -0.4em;
      font-size: 1.15em;
      font-weight: 600;
      color: var(--strong);
    }

    .line {
      flex: 0 0 100%;
      height: 1px;
      background: var(--muted);   /* Reply jaisa colour */
    }

    .avatar {
      width: 1.8em;
      height: 1.8em;
      border-radius: 50%;
      object-fit: cover;
      background: #1f2a2d;
      flex-shrink: 0;
      cursor: pointer;
    }

    .content { flex: 1; min-width: 0; }
    .avatar, .content { margin-top: 0; }

    .header {
      display: flex;
      align-items: center;
      gap: 0.5em;
      font-size: 0.85em;
      color: var(--weak);
      height: 2.12em;
    }

    .username { color: var(--strong); font-weight: 600; }

    .body {
      margin: 0 0 0.35em;
      font-size: 1em;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 0.4em;
      font-size: 0.85em;
      font-weight: 600;
      color: var(--muted);
      margin-left: -0.6em;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 0.5em;
      padding: 0.5em 0.6em;
      border-radius: 2em;
    }

    .btn svg { width: 1.5em; height: 1.5em; display: block; }

    .votes { gap: 0.45em; }
    .votes .up   { color: var(--orange); }
    .votes .down { color: var(--muted); }
    .votes .count { color: var(--muted); font-weight: 600; min-width: 1em; text-align: center; }

    /* ---------- edit (pencil) ---------- */
    .pen {
      all: unset;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.5em;
      margin-left: 0.35em;
      border-radius: 50%;
      color: var(--muted);
      cursor: pointer;
      vertical-align: middle;
      opacity: 0.8;
    }
    .pen:hover { opacity: 1; background: #1f2a2d; }
    .pen svg { width: 0.95em; height: 0.95em; }

    [contenteditable="true"] {
      outline: 1px dashed #4a4a4d;
      outline-offset: 3px;
      border-radius: 3px;
    }

    /* ---------- save button ---------- */
    .save {
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: var(--orange);
      border: 0;
      border-radius: 2rem;
      padding: 0.7rem 2.4rem;
      cursor: pointer;
    }
    .save:hover { filter: brightness(1.1); }

    /* image save hote waqt pencil/outline chhup jaate hain */
    body.capturing .pen { display: none !important; }
    body.capturing [contenteditable] { outline: none !important; }
  </style>
</head>
<body>

  <div class="comment" id="comment">

    <!-- heading (yahan text edit kar sakte ho) -->
    <div class="title">Comments</div>

    <!-- horizontal line -->
    <div class="line"></div>

    <!-- Profile picture: avatar par click karke image chuno (yaad rahegi),
         ya "profile.png" naam se isi folder me rakho -->
    <img class="avatar" id="avatar" src="assets/avatar.png" alt="" title="Click to change picture">
    <input type="file" id="avatarInput" accept="image/*" hidden>

    <div class="content">

      <!-- ===== USERNAME + TIME ===== -->
      <div class="header">
        <span class="username">Weirddit</span>
        <span>•</span>
        <span class="time" id="time">3mo ago</span><button class="pen" data-target="time" title="Edit time"></button>
      </div>

      <!-- ===== COMMENT TEXT ===== -->
      <p class="body"><span id="text">Yahan apna comment ka text likho.</span><button class="pen" data-target="text" title="Edit text"></button></p>

      <!-- ===== ACTIONS ===== -->
      <div class="actions">
        <div class="btn votes">
          <!-- upvote (filled) -->
          <svg class="up" viewBox="0 0 20 20" fill="currentColor"><path d="M12.877 19H7.123A1.125 1.125 0 0 1 6 17.877V11H2.126a1.114 1.114 0 0 1-1.007-.6 1.12 1.12 0 0 1 .107-1.21L9.108.53a1.125 1.125 0 0 1 1.784 0l7.882 8.66a1.12 1.12 0 0 1 .107 1.21 1.114 1.114 0 0 1-1.007.6H14v6.877A1.125 1.125 0 0 1 12.877 19z"/></svg>
          <span class="count" id="count">15</span><button class="pen" data-target="count" title="Edit upvotes"></button>
          <!-- downvote (outline) -->
          <svg class="down" viewBox="0 0 20 20" fill="currentColor"><path transform="rotate(180 10 10)" fill-rule="evenodd" d="M12.877 19H7.123A1.125 1.125 0 0 1 6 17.877V11H2.126a1.114 1.114 0 0 1-1.007-.6 1.12 1.12 0 0 1 .107-1.21L9.108.53a1.125 1.125 0 0 1 1.784 0l7.882 8.66a1.12 1.12 0 0 1 .107 1.21 1.114 1.114 0 0 1-1.007.6H14v6.877A1.125 1.125 0 0 1 12.877 19zM7.5 17.5h5V9.5h4.678L10 1.979 2.322 9.5H7.5v8z"/></svg>
        </div>

        <div class="btn reply">
          <!-- reply -->
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10 2.5c-4.4 0-7.5 2.9-7.5 6.5 0 2 1 3.7 2.6 4.9-.1 1.2-.6 2.3-1.6 3.1 1.9 0 3.5-.7 4.6-1.6.6.1 1.3.2 1.9.2 4.4 0 7.5-2.9 7.5-6.5S14.4 2.5 10 2.5z"/></svg>
          <span>Reply</span>
        </div>
      </div>

    </div>
  </div>

  <button class="save" id="save">Save</button>

  <script>
    // ---- pencil icons ----
    var PENCIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>';
    document.querySelectorAll('.pen').forEach(function (b) {
      b.innerHTML = PENCIL;
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });
      b.addEventListener('click', function () {
        var el = document.getElementById(b.dataset.target);
        if (el.isContentEditable) { el.blur(); return; }
        el.contentEditable = 'true';
        el.focus();
        var r = document.createRange();
        r.selectNodeContents(el);
        r.collapse(false);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      });
    });
    ['time', 'text', 'count'].forEach(function (id) {
      var el = document.getElementById(id);
      el.addEventListener('blur', function () { el.removeAttribute('contenteditable'); });
      if (id !== 'text') {
        el.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
        });
      }
    });

    // ---- profile picture (click to choose, remembered) ----
    var avatar = document.getElementById('avatar');
    var input = document.getElementById('avatarInput');
    try {
      var saved = localStorage.getItem('weirddit_avatar');
      if (saved) avatar.src = saved;
    } catch (e) {}
    avatar.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () {
      var f = input.files[0];
      if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        avatar.src = fr.result;
        try { localStorage.setItem('weirddit_avatar', fr.result); } catch (e) {}
      };
      fr.readAsDataURL(f);
    });

    // ---- save as image ----
    document.getElementById('save').addEventListener('click', function () {
      if (document.activeElement) document.activeElement.blur();
      document.body.classList.add('capturing');
      html2canvas(document.getElementById('comment'), {
        backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(),
        scale: 3
      }).then(function (canvas) {
        canvas.toBlob(function (blob) {
          document.body.classList.remove('capturing');
          if (!blob) { alert('Image save nahi ho payi. Avatar par click karke picture dobara chuno.'); return; }
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'comment.png';
          a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
        }, 'image/png');
      }).catch(function () {
        document.body.classList.remove('capturing');
        alert('Image save nahi ho payi. Internet check karo aur avatar par click karke picture dobara chuno.');
      });
    });
  </script>

</body>
</html>
